# Bypass Hostinger "GIT → Deploy" when git pull fails (divergent branches).
# Configure secrets in GitHub → repo → Settings → Secrets and variables → Actions:
#
#   HOSTINGER_FTP_HOST     — from hPanel → Files → FTP Accounts (often ftp.hostinger.com)
#   HOSTINGER_FTP_USER
#   HOSTINGER_FTP_PASSWORD
#
# FTP account is usually rooted at your site's public_html → workflow uses server-dir: .
# If your FTP lands elsewhere, fork and change server-dir in the "Upload site" step.
#
# After this works, turn OFF Hostinger GIT auto-deployment to avoid two deploy paths fighting.

name: Deploy Hostinger (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Upload site (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: .
          exclude: |
            **/.git*
            **/.git*/**
            **/frontend/node_modules/**
            **/.github/**
            **/.cursor/**
            **/agent-transcripts/**
          log-level: verbose
