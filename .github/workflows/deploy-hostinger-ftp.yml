# Build frontend and upload Vite output to Hostinger via FTP/FTPS.
# Requires repository Secrets (Settings → Secrets and variables → Actions):
#   HOSTINGER_FTP_HOST, HOSTINGER_FTP_USER, HOSTINGER_FTP_PASSWORD
# Optional repository Variables:
#   HOSTINGER_FTP_SERVER_DIR — remote folder relative to FTP login root (default: frontend/dist/)
#   HOSTINGER_FTP_PROTOCOL — ftp | ftps | ftps-legacy (default: ftp — most reliable from GitHub to Hostinger)
# Assumes FTP root is the site document root (e.g. public_html). Then CSS will be at:
#   /frontend/dist/css/datacapture.css  → matches vite.config.js base: /frontend/dist/

name: Deploy Hostinger (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger-ftp
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # Remote path is relative to your FTP account root (often = public_html).
      # Default protocol is plain FTP (port 21): FTPS often fails from GitHub runners on Hostinger.
      # To force FTPS: set Variable HOSTINGER_FTP_PROTOCOL = ftps (and use hPanel FTP TLS hostname/port if required).
      - name: Deploy frontend/dist to Hostinger (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ${{ vars.HOSTINGER_FTP_PROTOCOL || 'ftp' }}
          port: 21
          security: loose
          local-dir: ./frontend/dist/
          server-dir: ${{ vars.HOSTINGER_FTP_SERVER_DIR || 'frontend/dist/' }}
          timeout: 120000
          log-level: standard
