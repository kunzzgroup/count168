name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy (site + org on EC2)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 15m
          debug: true
          script: |
            set -euo pipefail
            SITE_ROOT=/var/www/count168
            if [[ ! -x "${SITE_ROOT}/deploy/deploy.sh" ]]; then
              echo "ERROR: ${SITE_ROOT}/deploy/deploy.sh missing"
              exit 1
            fi
            if [[ ! -d /var/www/count168.org/.git ]]; then
              echo "ERROR: /var/www/count168.org not cloned — run on EC2:"
              echo "  sudo git clone --branch main --depth 1 https://github.com/kunzzgroups/count168test.git /var/www/count168.org"
              echo "  sudo chown -R ec2-user:nginx /var/www/count168.org"
              exit 1
            fi
            if [[ -x "${SITE_ROOT}/deploy/deploy-ec2-all.sh" ]]; then
              bash "${SITE_ROOT}/deploy/deploy-ec2-all.sh"
            else
              bash "${SITE_ROOT}/deploy/deploy.sh"
              bash "${SITE_ROOT}/deploy/deploy-org.sh"
            fi
