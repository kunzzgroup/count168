    location = /domainapi.php {
        rewrite ^ /api/domain/domain_api.php last;
    }

    location = /logout {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api/session/logout_api.php;
        fastcgi_pass unix:/run/php-fpm/www.sock;
    }

    location /frontend/dist/ {
        try_files $uri $uri/ /frontend/dist/index.html;
    }

    location /images/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    location /js/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /favicon.ico {
        try_files $uri =404;
        access_log off;
    }

    location ^~ /api/ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php-fpm/www.sock;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 120s;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php-fpm/www.sock;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 120s;
    }

    # --- UUID SPA routes (/p/{uuid}) ---
    location ~ ^/p/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$ {
        add_header Cache-Control "no-cache";
        try_files /frontend/dist/index.html =404;
    }

    location ~ ^/(includes|database|\.git) {
        deny all;
        return 404;
    }
