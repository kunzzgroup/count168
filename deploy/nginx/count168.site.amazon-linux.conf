# count168 — Amazon Linux 2023 / Nginx (conf.d)
# 安装: sudo cp 本文件 /etc/nginx/conf.d/count168.site.conf
# 删掉旧 SSL 碎片: sudo rm -f /etc/nginx/conf.d/count168.site-le-ssl.conf /etc/nginx/conf.d/default.conf
# 证书就绪后见同目录 count168.site.amazon-linux.ssl.conf 说明，或运行 certbot --nginx
# 然后: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name count168.site www.count168.site _;

    root /var/www/count168;
    index index.html;

    client_max_body_size 64M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location ^~ /frontend/dist/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ^~ /frontend/dist/css/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /frontend/dist/index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = / {
        return 302 /p/05659e0a-5121-427b-b5f2-7bbc43e14b23;
