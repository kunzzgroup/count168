<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EazyCount</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
  <link rel="stylesheet" th:href="@{/css/index.css}"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/global-13inch.css}"/>
  <link rel="stylesheet" th:href="@{/dashboard-app/assets/dashboard-react.css}"/>
  <script th:inline="javascript">
    window.__SPA_DEFAULT_ROUTE = /*[[${spaDefaultRoute}]]*/ '/login';
    window.__LOGIN_BOOTSTRAP_URL__ = /*[[${loginBootstrapUrl}]]*/ '';
    window.__API_BASE_URL__ = /*[[${browserApiBase}]]*/ '';
    (function () {
      var b = String(window.__API_BASE_URL__ || '').trim()
      if (b) {
        window.__API_BASE_URL__ = b.replace(/\/$/, '')
        return
      }
      var h = location.hostname || ''
      if (!h && location.protocol === 'file:') {
        window.__API_BASE_URL__ = 'http://127.0.0.1:8090'
        return
      }
      if (/^(127\.0\.0\.1|localhost)$/i.test(h) || h === '[::1]') {
        window.__API_BASE_URL__ = 'http://127.0.0.1:8090'
        return
      }
      window.__API_BASE_URL__ = location.origin
    })()
  </script>
  <script th:src="@{/js/api-bridge.js}"></script>
</head>
<body class="bg">
<div id="root"></div>
<script type="module" th:src="@{/dashboard-app/assets/dashboard-react.js}"></script>
</body>
</html>
