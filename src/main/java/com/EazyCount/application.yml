# EazyCount backend: Spring Boot + MyBatis; auth UI is the React SPA (../frontend).
# Browser redirects from /login, /dashboard, etc. go to eazycount.spa.base-url (Vite default 5173).
# This file lives under src/main/java/com/EazyCount/ and is copied to the classpath root by pom.xml.
server:
  port: 8082

eazycount:
  spa:
    base-url: ${EAZYCOUNT_SPA_BASE_URL:http://localhost:5173}

spring:
  application:
    name: EazyCount
  datasource:
    url: ${EAZYCOUNT_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/eazycount?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Kuala_Lumpur}
    username: ${EAZYCOUNT_DATASOURCE_USERNAME:root}
    password: ${EAZYCOUNT_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  thymeleaf:
    cache: false

mybatis:
  mapper-locations: classpath:com/EazyCount/xml/*.xml
  type-aliases-package: com.EazyCount.entity
  configuration:
    map-underscore-to-camel-case: true
