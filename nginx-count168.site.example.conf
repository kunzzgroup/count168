# Nginx：整站示例（静态 + /api 反代 Spring）。复制后改 ssl_certificate、root、upstream 端口。
# 若用 Apache + spring-api-bridge.php，则不需要本段。
upstream eazycount_spring {
  server 127.0.0.1:8090;
}

server {
  listen 443 ssl http2;
  server_name count168.site www.count168.site;
  # ssl_certificate     /path/fullchain.pem;
  # ssl_certificate_key /path/privkey.pem;

  root /var/www/count168test;
  index index.html;

  location /api/ {
    proxy_pass http://eazycount_spring/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
