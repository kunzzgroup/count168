# count168.site 最终可用示例：静态前端 + /api 反代到 Spring(8090)
# 使用方法：
# 1) 复制到 /etc/nginx/conf.d/count168.site.conf
# 2) 填好证书路径、root
# 3) nginx -t && systemctl reload nginx
upstream eazycount_api {
  server 127.0.0.1:8090;
  keepalive 32;
}

server {
  listen 80;
  server_name count168.site www.count168.site;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name count168.site www.count168.site;

  # TODO: 改成你的真实证书路径
  ssl_certificate     /etc/letsencrypt/live/count168.site/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/count168.site/privkey.pem;

  root /var/www/count168test;
  index index.html;

  # API：/api/auth/login、/api/company/verify 都会走到 8090
  location /api/ {
    proxy_pass http://eazycount_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }

  # React SPA
  location / {
    try_files $uri $uri/ /index.html;
  }
}
