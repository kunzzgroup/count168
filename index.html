<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EazyCount</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/index.css" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/global-13inch.css" />
  <script>
    (function () {
      var q = new URLSearchParams(window.location.search || '')
      if (q.get('logout') === '1') {
        document.cookie = 'remember_token=; path=/; max-age=0'
        var clean = window.location.pathname || '/'
        window.history.replaceState(null, '', clean)
      }
      var r = q.get('r')
      if (r && r.charAt(0) === '/') {
        if (!window.location.hash || window.location.hash === '#') {
          window.location.hash = '#' + r
        }
      }
    })()
    window.__SPA_DEFAULT_ROUTE = '/login'
    window.__API_BASE_URL__ = typeof window.__API_BASE_URL__ === 'string' ? window.__API_BASE_URL__ : window.location.origin
  </script>
  <script src="js/api-bridge.js"></script>
  <link rel="stylesheet" href="dashboard-app/assets/dashboard-react.css" />
</head>
<body class="bg">
  <div id="root"></div>
  <script type="module" src="dashboard-app/assets/dashboard-react.js"></script>
</body>
</html>
